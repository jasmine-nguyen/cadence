name: Python tests

# Trigger economy (keeps Actions minutes down):
#   - push on `main` and pull_request, both path-filtered to backend files, so
#     this stays dormant until backend/ exists and skips Expo-only changes
#     (client-tests.yml covers that side).
# Caveat: if branch protection ever marks this a REQUIRED check, a path-skipped run
# leaves the PR's check "pending" and can block merge — revisit paths if that's turned on.
on:
  push:
    branches: [main]
    paths:
      # Not the root requirements.txt — that's the build-graph tooling, not the backend.
      - "backend/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # coros-mcp's login otherwise tries a system keyring and hangs on a headless runner.
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4

      # Until backend/ lands, a change to this workflow file alone would trigger a run
      # with nothing to install. Skip cleanly instead; drop these `if`s once it exists.
      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          # Match the Lambda runtime once infra/main pins it.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: python -m pip install -r backend/requirements.txt pytest pytest-cov

      # Prints the per-file coverage table into the Actions log. No --cov-fail-under
      # yet: add a floor once there are real tests, then ratchet it up.
      # Exit code 5 means "no tests collected" — allowed until the first test lands.
      - name: Run tests with coverage
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          python -m pytest --cov=backend --cov-report=term-missing || [ $? -eq 5 ]

      # Render the coverage table onto the run summary page. Runs even if the tests
      # failed, so the numbers are visible either way.
      - name: Coverage summary
        if: always() && hashFiles('backend/requirements.txt') != ''
        run: |
          {
            echo "## 🐍 Python coverage"
            echo ""
            python -m coverage report --format=markdown 2>/dev/null \
              || { echo '```'; python -m coverage report 2>/dev/null || echo "(no coverage data)"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
